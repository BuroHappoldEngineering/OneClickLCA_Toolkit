[project]
name = "oneclicklca_toolkit"
readme = "README.md"
authors = [
    { name = "BuroHappoldEngineering", email = "bhombot@burohappold.com" }
]
dynamic = ["version", "description"]
dependencies = [
	"pandas~=2.2.3"
	"openai",
	"pyspark",
	"langchain-openai",
	"langchain-chroma",
	"openpyxl"
]

[urls]
source = "https://github.com/BuroHappoldEngineering/OneClickLCA_Toolkit"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests"]

[tool.setuptools.package-data]
"*" = ["*.xlsx", "*.csv", "*.json"]

[tool.pytest.ini_options]
pythonpath = "src"
